<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEO-TRACE 法的情報</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f6f9;
    --surface: #ffffff;
    --border: rgba(30, 41, 59, 0.11);
    --text: #171b22;
    --text-muted: #5b6472;
    --accent: #0891c2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1e24;
      --surface: #20252c;
      --border: rgba(148, 163, 184, 0.14);
      --text: #e7eaf0;
      --text-muted: #8b95a7;
      --accent: #38bdf8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .bar { display: flex; align-items: center; gap: 10px; }
  .bar__dot { width: 8px; height: 8px; border-radius: 999px; background: var(--accent); }
  .bar__label {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--text-muted);
  }
  h1 {
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-size: 22px;
    margin: 0;
  }
  .links { display: flex; flex-direction: column; gap: 12px; }
  a.link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
  }
  a.link span.arrow { color: var(--accent); font-family: "JetBrains Mono", monospace; }
</style>
</head>
<body>
  <div class="card">
    <div class="bar"><span class="bar__dot"></span><span class="bar__label">GEO-TRACE <strong>// LEGAL</strong></span></div>
    <h1>法的情報</h1>
    <nav class="links">
      <a class="link" href="privacy-policy.html">プライバシーポリシー <span class="arrow">→</span></a>
      <a class="link" href="terms-of-service.html">利用規約 <span class="arrow">→</span></a>
    </nav>
  </div>
</body>
</html>
